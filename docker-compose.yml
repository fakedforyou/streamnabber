services:
  streamnabber:
    build: .
    container_name: streamnabber
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      SECRET_KEY: "change-this-value"
      CHECK_INTERVAL: "10"
      RECHECK_INTERVAL: "60"
      RETRY_INTERVAL: "60"
      STALE_INTERVAL: "180"
      MAX_CONCURRENT_DOWNLOADS: "100"
      DATA_DIR: "/app/data"
      DOWNLOAD_DIR: "/app/downloads"
    volumes:
      - ./data:/app/data
      - ./downloads:/app/downloads
